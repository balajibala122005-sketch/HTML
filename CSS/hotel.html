            margin: 0;

            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #333;
            padding: 15px 30px;
            font-family: sans-serif;
        }


        .d1 {
            color: #fff;
            font-size: 24px;
            font-weight: bold;
        }


        .nav-links a {
            text-decoration: none;
            color: #bbb;
            font-size: 16px;
            padding: 8px 12px;
            transition: color 0.3s ease;
        }
        h1{
            text-align: center;
            position:absolute;
            top: 400px;
            left: 500px;
            border-width: 20px;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #fff;
        }
        body{
            background-image:url(/Image/bg5.jpg);
        }
    </style>
</head>
