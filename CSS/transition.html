<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transition</title>
    <style>
        .b1{
            border: 1px as solid rgb(10, 10, 10);
            background-color: rgb(209, 12, 193);
            color: rgb(25, 219, 7);
            height: 200px;
            width: 100px;
            transition: 2s;
            border-radius: 10px;
        }
        .b1:hover{
            border: 1px as solid black;
            background-color: rgb(228, 195, 11);
            color: rgb(27, 7, 207);
            transition: 2s;
        }
        .b2{
            border: 1px as solid rgb(10, 10, 10);
            background-color: rgb(250, 246, 250);
            color: rgb(25, 219, 7);
            transition: 2s;
            border-radius: 10px;
        }
        .b2:hover{
            border: 1px as solid black;
            background-color: rgb(228, 195, 11);
            color: rgb(27, 7, 207);
            height: 200px;
            width: 100px;
            transition: 2s;
        }
    </style>
</head>
<body>
    <button class="b1">Click</button>
    <button class="b2">Click</button>

    <audio src="/Audio/grand_project-wonders-of-the-earth-550792.mp3" a> </audio>
</body>
</html>
