<html>
    <head>
        <title>marquee demo</title>
    </head>
    <body>
        <marquee behavior="Alternate" scrollamount="90" direction="right-left"><h1>welcome to my wesite</h1></marquee>
        <marquee behavior="slide" scrollamount="90" direction="left-right"><h1>welcome to my wesite</h1></marquee>
        <marquee behavior="scroll" Scrolldelay="90" direction="Up"><h1>welcome to my wesite</h1></marquee>
        <table>
            <tr>
                <td><img src="Hotel Booking Website/bg1.jpg"></td>
                <td><marquee behavior="scroll" direction="Down">welcome</marquee></td>
                <td><img src="Hotel Booking Website/bg1.jpg"></td>

            </tr>
            <tr>
                <td><marquee behavior="scroll" direction="right">welcome</marquee></td>
                <td><img src="Hotel Booking Website/bg1.jpg"></td>
                
                <td><marquee behavior="scroll" direction="left">welcome</marquee></td>

            </tr>
            <tr>
                <td><img src="Hotel Booking Website/bg1.jpg"></td>
                <td><marquee behavior="scroll" direction="Up">welcome</marquee></td>
                <td><img src="Hotel Booking Website/bg1.jpg"></td>
            </tr>
        </table>

    </body>
</html>
