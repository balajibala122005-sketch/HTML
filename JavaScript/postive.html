<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <Script>
        let a=Number(prompt("Enter a Value:"));
        if(a>0){
            document.write("A is Positive");

        }
        else if(a<0){
            document.write("A is Negative");
            
        }
        else if(a==0){
            document.write("A is Nuteral");
            
        }
        else{
            document.write("Invalid!!");
        }
    </Script>
</body>
</html>
