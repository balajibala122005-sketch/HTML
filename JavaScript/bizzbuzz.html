<body>
    <Script>
        let a=Number(prompt("Enter your "));

//sanday or monday

            document.write("Sunday");
        }

        }
         else if(day==3){

        }

        }
         else if(day==5){
            document.write("Friday");

        else{
            document.write("Invalid!");
        }
    </Script>
