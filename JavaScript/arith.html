<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a=Number(prompt("Enter your value"));
        let b=Number(prompt("Enter your value"));
        let c=Number(prompt("Enter your value"));
        if(c==1){
            document.write(a+b);
        }
        else if(c==2){
            document.write(a-b);
        }
        else if(c==3){
            document.write(a*b);
        }
        else if(c==4){
            document.write(a/b);
        }
        
        else{
            document.write("Invalid!")
        }
    </script>
</body>
</html>
