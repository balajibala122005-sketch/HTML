<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Registration Form</h1>
    <form action="" method="get">
        <table border="1">
            <tr>
                <td>Name:</td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td> Education qualifiacation:</td>
                <td><input type="checkbox">UG<input type="checkbox">PG<input type="checkbox">PhD</td>
            </tr>
            <tr>
                <td>Gender</td>
                <td><input type="radio">Male<input type="radio" name="gender" value="female">Female</td>
            </tr>
            <tr>
                <td>Date of Birth:</td>
                <td><input type="date"></td>
            </tr>
            <tr>
                <td>Age</td>
                <td><input type="number"></td>
            </tr>
            <tr>
                <td>Resume</td>
                <td><input type="file"></td>
            </tr>
            <tr>
                <td><input type="reset" value="Clear"></td>
                <td><input type="submit" value="Submit"></td>
            </tr>

        </table>
    </form>
</body>

</html>
