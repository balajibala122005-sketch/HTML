<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Data</title>
    <style>
        table {
            width: 50%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        ul {
            list-style-type: decimal;
        }
        li{
            background-color: aquamarine;
        }
       
    </style>
</head>
<body border="10">
    <h1><em><strong>Student Data</strong></em></h1>
    <table border="1">
        <tr><th>Name</th><th>Age</th></tr>
        <tr><td>John Doe</td><td>20</td></tr>
        <tr><td>Jane Smith</td><td>22</td></tr>
        <tr><td>Bob Johnson</td><td>21</td></tr>
        <tr><td>Alice Brown</td><td>23</td></tr>
        <tr><td>Charlie Davis</td><td>19</td></tr>
    </table>
    <h2><em><strong>Staff List</strong></em></h2>
    <ul>
        <li>Mr. Smith</li>
        <li>Ms. Johnson</li>
        <li>Mrs. Brown</li>
        <li>Mr. Davis</li>
    </ul>
</body>
</html>
